<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM event onchange</title>
    <link rel="stylesheet" href="DOM event onchange.css">
</head>
<body>
    
    <label for="name">Name:
        <input type="text" name="name" class="name-input" id="name-input">
    </label>
    <br>
<!----------------------------------------------------------------------------------------->
    <div>
        <h2>Programming department</h2>
        <label for="program">
            <input type="checkbox" name="program" id="" value="c">C
        </label><br>
        <label for="C">
            <input type="checkbox" name="program" id="" value="java">Java
        </label>
    </div><br>
<!----------------------------------------------------------------------------------------->
    <label for="department">Department</label>
    <select name="department" id="department">
        <option value="cse">CSE</option>
        <option value="eee">EEE</option>
        <option value="llb">LLB</option>
    </select>

    <script src="DOM event onchange.js"></script>
</body>
</html>
