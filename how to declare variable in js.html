<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to declare variable in js</title>
</head>
<body>
    


    <script>
        var name = "Antur Deb Nath"  // var means variable

        name = "Ramprashad Deb Nath"

        document.write(name);

    </script>
</body>
