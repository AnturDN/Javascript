<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    
    <script>

        var num1 = prompt("Enter first number : "); // taking user input
        var num2 = prompt("Enter second number : "); 
        var sum, sub, mul, div, rem;// instead of using so many variable we can use "result"

        num1 = parseInt(num1,10); // converting into integer
        num2 = parseInt(num2,10);

        sum = num1 + num2;
        document.write(num1 + " + " + num2 + " = " + sum + "<br>");

        sub = num1 - num2;
        document.write(num1 + " - " + num2 + " = " + sub + "<br>");

        mul = num1 * num2;
        document.write(num1 + " * " + num2 + " = " + mul + "<br>");

        div = num1 / num2;
        document.write(num1 + " / " + num2 + " = " + div + "<br>");

        rem = num1 % num2;
        document.write(num1 + " % " + num2 + " = " + rem + "<br>");

    </script>

</body>
</html>
